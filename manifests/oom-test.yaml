apiVersion: v1
kind: Pod
metadata:
  name: oom-test
spec:
  containers:
    - name: c
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "300M", "--vm-hang", "1"]
      resources:
        requests:
          memory: "50Mi"
        limits:
          memory: "100Mi"
