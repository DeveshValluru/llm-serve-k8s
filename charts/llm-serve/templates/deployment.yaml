apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: server
          image: "{{ .Values.engine.image }}"
          imagePullPolicy: {{ .Values.engine.pullPolicy }}
          {{- with .Values.engine.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.engine.port }}
          env:
            - name: HF_HOME
              value: {{ .Values.cache.mountPath | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              {{- if .Values.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.gpu.count }}
              {{- end }}
          startupProbe:
            httpGet: { path: {{ .Values.engine.startupPath }}, port: {{ .Values.engine.port }} }
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: {{ .Values.engine.readinessPath }}, port: {{ .Values.engine.port }} }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: {{ .Values.engine.livenessPath }}, port: {{ .Values.engine.port }} }
            periodSeconds: 10
          volumeMounts:
            - name: cache
              mountPath: {{ .Values.cache.mountPath }}
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-cache
